name: Commit Lint

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install conventional-pre-commit
        run: pip install conventional-pre-commit==4.4.0

      - name: Validate PR commit messages
        run: |
          git log --format="%H" "origin/${{ github.base_ref }}..HEAD" | \
          while IFS= read -r sha; do
            git log --format="%B" -n 1 "$sha" > /tmp/commit_msg
            conventional-pre-commit \
              --scopes auth,api,tools,models,scope,resources,dev,docs,chore,ci,deps,release,tests \
              build chore ci docs feat fix perf refactor revert style test \
              /tmp/commit_msg || {
                echo "❌ Invalid commit message in $sha:"
                git log --format="%s" -n 1 "$sha"
                exit 1
              }
          done
